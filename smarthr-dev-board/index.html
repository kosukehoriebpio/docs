let cy = null;
function buildGraphElements(a){
  if (a.graph && a.graph.nodes) return [...(a.graph.nodes||[]), ...(a.graph.edges||[])];
  const els=[];
  (a.layers||[]).forEach(l=>els.push({data:{id:'layer-'+l.id,label:l.label||l.id,kind:'layer',status:'layer'}}));

    (p.features||[]).forEach(f=>els.push({data:{id:'e-pf-'+p.id+'-'+f.id,source:'page-'+p.id,target:'featnode-'+f.id,kind:'uses'}}));

  });

      {selector:'node[kind="feature"]',style:{'shape':'ellipse','width':100,'height':40,'background-color':'#f7f6f3','border-width':3,'font-size':10}},
      {selector:'node[kind="layer"]',style:{'shape':'round-rectangle','background-color':'#f1f1ef','border-color':'#9b9a97','width':88,'height':34,'font-size':11,'font-weight':700}},
      {selector:'node[kind="backbone"], node[kind="source"]',style:{'shape':'round-rectangle','background-color':'#eef5fa','border-color':'#337ea9','width':118,'height':36,'font-size':10}},
      {selector:'node[status="done"]',style:{'border-color':STATUS_COLOR.done,'background-color':'#eef8f6'}},
      {selector:'node[status="wip"]',style:{'border-color':STATUS_COLOR.wip,'background-color':'#fbf3ea'}},
      {selector:'node[status="partial"]',style:{'border-color':STATUS_COLOR.partial,'background-color':'#fbf6ea'}},
      {selector:'node[status="todo"]',style:{'border-color':STATUS_COLOR.todo,'background-color':'#f1f1ef'}},
      {selector:'edge',style:{'width':1.5,'line-color':'#d3d1cb','target-arrow-color':'#d3d1cb','target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':0.8}},
      {selector:'edge[kind="uses"]',style:{'line-style':'dashed','line-color':'#b8b6b0','target-arrow-color':'#b8b6b0'}},
      {selector:'edge[kind="flow"]',style:{'line-color':'#337ea9','target-arrow-color':'#337ea9','width':2}}
    ],
    layout:hasDagre?{name:'dagre',rankDir:'TB',nodeSep:28,rankSep:48,edgeSep:12,padding:24,animate:false}:{name:'breadthfirst',directed:true,padding:24,spacingFactor:1.15,animate:false}
  });
  cy.nodes('[kind="page"], [kind="feature"]').forEach(n=>{const st=n.data('status'); if(STATUS_COLOR[st]) n.style('border-color', STATUS_COLOR[st]);});
  setTimeout(()=>{if(cy){cy.resize();cy.fit(undefined,32);}},40);
}
function wireGraphToolbar(){
  const wrap=document.getElementById('graphWrap');
  if(!wrap||wrap.dataset.wired) return; wrap.dataset.wired='1';
  document.getElementById('graphFit').onclick=()=>{if(cy) cy.fit(undefined,32)};
  document.getElementById('graphZoomIn').onclick=()=>{if(cy) cy.zoom({level:cy.zoom()*1.2,renderedPosition:{x:cy.width()/2,y:cy.height()/2}})};
  document.getElementById('graphZoomOut').onclick=()=>{if(cy) cy.zoom({level:cy.zoom()/1.2,renderedPosition:{x:cy.width()/2,y:cy.height()/2}})};
  document.getElementById('graphFs').onclick=()=>{
    wrap.classList.toggle('fullscreen');
    document.getElementById('graphFs').textContent=wrap.classList.contains('fullscreen')?'Exit':'Fullscreen';
    setTimeout(()=>{if(cy){cy.resize();cy.fit(undefined,32)}},80);
  };
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&wrap.classList.contains('fullscreen')){
      wrap.classList.remove('fullscreen'); document.getElementById('graphFs').textContent='Fullscreen';
      setTimeout(()=>{if(cy){cy.resize();cy.fit(undefined,32)}},80);
    }
  });
}
function pageCard(p){
  const st=p.status||'partial'; const pct=Math.max(0,Math.min(100,p.pct??0));
  const feats=p.features||[];
  const chips=feats.length?`<div class="feat-chips">${feats.map(f=>{const fs=f.status||'todo'; return `<span class="fchip ${esc(fs)}" title="${esc(f.id)} ${f.pct??''}%"><i class="dot"></i>${esc(f.title||f.id)}</span>`}).join('')}</div>`:`<div class="notes">紐づく機能なし（カタログ未設定）</div>`;
  return `<article class="page-card"><div class="page-card-head"><div><div class="title">${esc(p.title||p.id)}</div>${p.path?`<div class="path">${esc(p.path)}</div>`:''}</div><span class="stchip ${esc(st)}">${esc(stLabel(st))} ${pct}%</span></div>${p.notes?`<div class="notes">${esc(p.notes)}</div>`:''}<div class="pbar ${esc(st)}"><i style="width:${pct}%"></i></div>${chips}</article>`;
}
function renderArch(a){
  if(!a) return;
  document.getElementById('updated').textContent=a.updated||'';
  const c=a.counts||{}; const by=c.by_status||{};
  const links=c.page_feature_links!=null?c.page_feature_links:(a.pages||[]).reduce((n,p)=>n+((p.features||[]).length),0);
  document.getElementById('counts').textContent=`画面 ${c.pages??0} · 機能 ${c.features??0} · 紐付 ${links} · done ${by.done||0} / partial ${by.partial||0} / todo ${by.todo||0}`;
  document.getElementById('archMeta').textContent=`${a.repo||''} @ ${a.branch||'?'} · ${a.repo_path||''}`;
  document.getElementById('archLayers').innerHTML=(a.layers||[]).map(l=>`<div class="layer"><b>${esc(l.label||l.id)}</b><span>${esc(l.summary||'')}</span></div>`).join('');
  document.getElementById('archPages').innerHTML=(a.pages||[]).map(pageCard).join('')||'<p class="closed">なし</p>';
  const row=it=>{const st=it.status||'partial'; const pct=Math.max(0,Math.min(100,it.pct??0)); return `<div class="arch-row"><div><div class="title">${esc(it.title||it.id)}</div>${it.domain?`<div class="path">${esc(it.domain)}</div>`:''}<div class="pbar ${esc(st)}"><i style="width:${pct}%"></i></div></div><span class="stchip ${esc(st)}">${esc(stLabel(st))} ${pct}%</span></div>`};
  document.getElementById('archFeatures').innerHTML=(a.features||[]).map(row).join('')||'<p class="closed">なし</p>';
  const gaps=a.gaps||[];
  document.getElementById('archGaps').innerHTML=gaps.length?gaps.map(g=>`<li>ギャップ: ${esc(g)}</li>`).join(''):'';
  wireGraphToolbar(); renderCyGraph(a);
}
function boot(){
  try{ if(window.cytoscape&&window.cytoscapeDagre){ cytoscape.use(cytoscapeDagre); window.cytoscapeDagreRegistered=true; } }
  catch(e){ window.cytoscapeDagreRegistered=false; }
  renderArch(JSON.parse(document.getElementById('ARCH_STATE').textContent));
  window.addEventListener('resize',()=>{ if(cy) cy.resize(); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
</html>
