<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLAUDE HUB</title>
<style>

:root {
  --bg: #f7f6f3;
  --card: #ffffff;
  --ink: #37352f;
  --muted: #787774;
  --border: #e9e9e7;
  --ok: #0f7b6c;
  --warn: #cb912f;
  --crit: #e03e3e;
  --busy: #d9730d;
  --idle: #337ea9;
  --soft: #f1f1ef;
  --radius: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: var(--bg);
  padding: 28px 22px 48px;
  line-height: 1.5;
}
.wrap { max-width: 1180px; margin: 0 auto; }
.topbar {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;
  margin-bottom: 22px; padding: 14px 16px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
}
.brand { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em; color: var(--ink); }
.brand span { color: var(--muted); font-weight: 500; font-size: .82rem; margin-left: 8px; }
.hud { display: flex; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.chip {
  border: 1px solid var(--border); background: var(--soft); border-radius: 999px;
  padding: 4px 10px; color: var(--ink);
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
.dot.ok { background: var(--ok); }
.dot.crit { background: var(--crit); }
.live { color: var(--ok); font-weight: 600; }
.err { color: var(--crit); font-weight: 600; }
h2 {
  font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  margin: 22px 0 12px; font-weight: 700;
}
.cockpit {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}
.window {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; box-shadow: 0 1px 2px rgba(55,53,47,.04); position: relative;
}
.window::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--idle), transparent); opacity: .55;
}
.window.busy::before { background: linear-gradient(90deg, transparent, var(--busy), transparent); }
.window.warn { border-color: #f0e0b8; }
.window.critical { border-color: #f2c3c3; box-shadow: 0 0 0 1px rgba(224,62,62,.08); }
.titlebar {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: #fafafa; border-bottom: 1px solid var(--border);
}
.traffic { display: flex; gap: 5px; }
.traffic i { width: 9px; height: 9px; border-radius: 50%; background: #d3d1cb; display: inline-block; }
.window.busy .traffic i:nth-child(1) { background: var(--busy); }
.window.idle .traffic i:nth-child(2) { background: var(--idle); }
.window.critical .traffic i:nth-child(3) { background: var(--crit); }
.wname { font-weight: 700; font-size: .9rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: #fff; }
.badge.busy { color: var(--busy); background: #fbf3ea; }
.badge.idle { color: var(--idle); background: #eef5fa; }
.body { padding: 14px; display: grid; grid-template-columns: 88px 1fr; gap: 14px; }
.gauge {
  width: 88px; height: 88px; border-radius: 50%;
  background: conic-gradient(var(--gcolor) calc(var(--gpct) * 1%), #ecebe8 0);
  display: grid; place-items: center; position: relative;
}
.gauge::after {
  content: ""; position: absolute; inset: 10px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--border);
}
.gauge .gtxt { position: relative; z-index: 1; text-align: center; line-height: 1.1; }
.gauge .gtxt b { display: block; font-size: 1.02rem; }
.gauge .gtxt small { color: var(--muted); font-size: .62rem; letter-spacing: .04em; }
.side .cwd { font-size: .72rem; color: var(--muted); word-break: break-all; margin-bottom: 8px; }
.summary-title {
  font-size: .92rem; font-weight: 650; color: var(--ink); margin: 0 0 8px; line-height: 1.35;
}
.bullets { margin: 0 0 10px; padding-left: 1.15em; font-size: .84rem; color: var(--ink); }
.bullets li { margin: 0 0 4px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.mchip {
  font-size: .68rem; color: var(--muted); background: var(--soft);
  border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
}
.mchip strong { color: var(--ink); font-weight: 600; }
.hint { margin-top: 8px; font-size: .75rem; color: var(--warn); background: #fbf6ea; border: 1px solid #f0e0b8; border-radius: 6px; padding: 6px 8px; }
.userq { margin-top: 8px; font-size: .75rem; color: var(--muted); }
.alerts {
  margin-bottom: 12px; padding: 10px 12px; border-radius: var(--radius);
  border: 1px solid #f2c3c3; background: #fdf5f5; font-size: .88rem;
}
.waits { display: flex; flex-direction: column; gap: 10px; }
.wcard {
  display: grid; grid-template-columns: 48px 1fr; gap: 12px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
}
.wcard.urgent { border-color: #f2c3c3; background: #fdf8f8; }
.num {
  width: 48px; height: 48px; border-radius: 8px; display: grid; place-items: center;
  font-weight: 800; background: #37352f; color: #fff;
}
.wcard.urgent .num { background: var(--crit); }
.wcard h3 { margin: 0 0 6px; font-size: .95rem; color: var(--ink); }
.wcard p, .wcard li { margin: 0 0 6px; font-size: .86rem; color: var(--ink); }
.wcard ol { margin: 0; padding-left: 1.15em; }
.how { font-size: .8rem; color: var(--muted); }
.reply {
  display: inline-block; margin-top: 4px; font-size: .78rem;
  background: var(--soft); border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px;
  font-family: ui-monospace, Consolas, monospace; color: var(--ink);
}
.closed { color: var(--muted); font-size: .8rem; margin-top: 8px; }
footer { margin-top: 22px; color: var(--muted); font-size: .72rem; }


.tabs {
  display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 18px;
  padding: 4px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
}
.tab {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font: inherit; font-size: .86rem; font-weight: 600; padding: 8px 14px; border-radius: 6px;
}
.tab:hover { background: var(--soft); color: var(--ink); }
.tab.active { background: var(--soft); color: var(--ink); box-shadow: inset 0 -2px 0 var(--idle); }
.view { display: none; }
.view.active { display: block; }
.arch-meta { font-size: .8rem; color: var(--muted); margin: 0 0 12px; }
.layers { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 14px; }
.layer {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 12px; font-size: .78rem;
}
.layer b { display: block; font-size: .84rem; margin-bottom: 2px; }
.layer span { color: var(--muted); }
.arch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .arch-grid { grid-template-columns: 1fr; } }
.arch-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
}
.arch-panel h3 { margin: 0 0 10px; font-size: .88rem; }
.arch-row {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .82rem;
}
.arch-row:last-child { border-bottom: none; }
.arch-row .title { font-weight: 600; }
.arch-row .path { color: var(--muted); font-size: .72rem; font-family: ui-monospace, Consolas, monospace; }
.arch-row .notes { color: var(--muted); font-size: .72rem; margin-top: 2px; }
.stchip {
  font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--border); white-space: nowrap;
}
.stchip.done { color: var(--ok); background: #eef8f6; }
.stchip.wip { color: var(--busy); background: #fbf3ea; }
.stchip.partial { color: var(--warn); background: #fbf6ea; }
.stchip.todo { color: var(--muted); background: var(--soft); }
.pbar {
  height: 6px; background: #ecebe8; border-radius: 999px; overflow: hidden; margin-top: 6px; grid-column: 1 / -1;
}
.pbar > i { display: block; height: 100%; background: var(--ok); }
.pbar.wip > i { background: var(--busy); }
.pbar.partial > i { background: var(--warn); }
.pbar.todo > i { background: #b0aea7; }
.graph-wrap {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px; position: relative; overflow: hidden;
  min-height: 520px; height: min(70vh, 720px);
  touch-action: none;
}
.graph-wrap.fullscreen {
  position: fixed; inset: 0; z-index: 9999; margin: 0; border-radius: 0;
  height: 100vh; min-height: 100vh; max-height: none;
}
#archGraph { width: 100%; height: 100%; min-height: 520px; background: #fbfbfa; }
.graph-toolbar {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.graph-toolbar button {
  min-width: 44px; min-height: 36px; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: rgba(255,255,255,.92); color: var(--ink);
  font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
  box-shadow: 0 1px 2px rgba(55,53,47,.06);
}
.graph-toolbar button:active { background: var(--soft); }
.graph-legend {
  display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px;
  font-size: .75rem; color: var(--muted);
}
.graph-legend .lg {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 10px;
}
.graph-legend i {
  width: 10px; height: 10px; border-radius: 50%; display: inline-block;
}
.lg-done i { background: var(--ok); }
.lg-wip i { background: var(--busy); }
.lg-partial i { background: var(--warn); }
.lg-todo i { background: #b0aea7; }
.lg-layer i { background: #9b9a97; border-radius: 2px; }
.lg-backbone i { background: #337ea9; border-radius: 2px; }
.page-cards { display: flex; flex-direction: column; gap: 12px; }
.page-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: 0 1px 2px rgba(55,53,47,.04);
}
.page-card-head {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-start;
  margin-bottom: 8px;
}
.page-card .title { font-weight: 700; font-size: .95rem; }
.page-card .path {
  color: var(--muted); font-size: .78rem; font-family: ui-monospace, Consolas, monospace; margin-top: 2px;
}
.page-card .notes { color: var(--muted); font-size: .78rem; margin: 6px 0 8px; }
.feat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .72rem; font-weight: 600; padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--soft); color: var(--ink);
  min-height: 28px;
}
.fchip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.fchip.done { background: #eef8f6; border-color: #cfe8e3; }
.fchip.done .dot { background: var(--ok); }
.fchip.wip { background: #fbf3ea; border-color: #f0d9bf; }
.fchip.wip .dot { background: var(--busy); }
.fchip.partial { background: #fbf6ea; border-color: #f0e0b8; }
.fchip.partial .dot { background: var(--warn); }
.fchip.todo { background: var(--soft); }
.fchip.todo .dot { background: #b0aea7; }
.feat-list-compact .arch-row { padding: 6px 0; font-size: .78rem; }
.feat-list-compact .notes { display: none; }
.feat-list-compact .pbar { margin-top: 4px; height: 4px; }
.gaps { font-size: .75rem; color: var(--muted); margin-top: 10px; padding-left: 1.2em; }
.iframe-view { width: 100%; min-height: 70vh; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
details.feat-fold { margin-top: 8px; }
details.feat-fold > summary {
  cursor: pointer; font-size: .8rem; font-weight: 650; color: var(--muted);
  list-style: none; padding: 6px 0;
}
details.feat-fold > summary::-webkit-details-marker { display: none; }


.page-picker-hint { font-size: .78rem; color: var(--muted); margin: -4px 0 10px; }
.page-card { cursor: default; transition: box-shadow .15s, border-color .15s; }
.page-card.is-open {
  border-color: #c5d4e8; box-shadow: 0 0 0 1px rgba(51,126,169,.12), 0 2px 8px rgba(55,53,47,.06);
}
.page-card-toggle {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 0; cursor: pointer; font: inherit; color: inherit;
}
.page-card-toggle:hover .title { color: var(--idle); }
.page-card-head { align-items: center; }
.page-card .chev {
  font-size: .72rem; color: var(--muted); margin-left: 8px; transition: transform .15s;
}
.page-card.is-open .chev { transform: rotate(180deg); }
.page-detail {
  display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
}
.page-card.is-open .page-detail { display: block; }
.page-card.is-open .page-detail[hidden] { display: block; } /* override attr while open */
.page-detail-meta {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  margin-bottom: 12px; font-size: .8rem; color: var(--muted);
}
.page-detail-meta .path { font-family: ui-monospace, Consolas, monospace; color: var(--ink); }
.page-graph-wrap {
  position: relative; background: #fbfbfa; border: 1px solid var(--border);
  border-radius: var(--radius); height: 360px; min-height: 320px; max-height: 420px;
  margin-bottom: 14px; overflow: hidden; touch-action: none;
}
.page-cy { width: 100%; height: 100%; }
.page-graph-wrap .graph-toolbar { top: 8px; right: 8px; }
.page-graph-wrap .graph-toolbar button { min-width: 36px; min-height: 32px; padding: 4px 10px; font-size: .72rem; }
.page-detail h4 {
  margin: 12px 0 8px; font-size: .78rem; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted); font-weight: 700;
}
.feat-table {
  width: 100%; border-collapse: collapse; font-size: .82rem; margin-bottom: 8px;
}
.feat-table th, .feat-table td {
  text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top;
}
.feat-table th {
  font-size: .72rem; color: var(--muted); font-weight: 700;
  background: var(--soft); letter-spacing: .04em;
}
.feat-table .ftitle { font-weight: 650; }
.feat-table .fnotes { color: var(--muted); font-size: .72rem; margin-top: 2px; }
.feat-table .fpct { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 650; }
.feat-table .pbar { margin-top: 4px; min-width: 80px; }
.ev-list {
  margin: 0; padding-left: 1.15em; font-size: .74rem; color: var(--muted);
  font-family: ui-monospace, Consolas, monospace; columns: 2; column-gap: 18px;
}
.ev-list li { margin: 0 0 3px; break-inside: avoid; }
@media (max-width: 700px) { .ev-list { columns: 1; } }
.page-empty-feats {
  font-size: .8rem; color: var(--muted); padding: 10px 12px;
  background: var(--soft); border-radius: 6px; border: 1px dashed var(--border);
}

</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">CLAUDE HUB <span id="brandSub">タブ切替シェル</span></div>
    <div class="hud">
      <div class="chip"><i class="dot ok" id="liveDot"></i><span id="live">接続中…</span></div>
      <div class="chip" id="updated">—</div>
      <div class="chip" id="counts">—</div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="ビュー切替"></nav>

  <section class="view" id="view-session" data-view="session">
    <div id="alerts"></div>
    <h2>セッション・コックピット</h2>
    <div class="cockpit" id="sessions"></div>
    <h2>堀江待ち</h2>
    <div class="waits" id="waits"></div>
    <div class="closed" id="closed"></div>
  </section>

  <section class="view" id="view-dev" data-view="dev-smarthr">
    <h2>全体像 · smarthr-case-crm</h2>
    <div class="arch-meta" id="archMeta">architecture-state.json を読込中…</div>
    <div class="layers" id="archLayers"></div>
    <h2>構成図（インタラクティブ）</h2>
    <div class="graph-legend" id="archLegend" aria-label="ステータス凡例">
      <span class="lg lg-done"><i></i>完了</span>
      <span class="lg lg-wip"><i></i>作業中</span>
      <span class="lg lg-partial"><i></i>一部</span>
      <span class="lg lg-todo"><i></i>未着手</span>
      <span class="lg lg-layer"><i></i>レイヤ</span>
      <span class="lg lg-backbone"><i></i>基盤</span>
    </div>
    <div class="graph-wrap" id="graphWrap">
      <div class="graph-toolbar">
        <button type="button" id="graphFit" title="全体表示">Fit</button>
        <button type="button" id="graphZoomIn" title="拡大">＋</button>
        <button type="button" id="graphZoomOut" title="縮小">−</button>
        <button type="button" id="graphFs" title="フルスクリーン">Fullscreen</button>
      </div>
      <div id="archGraph" role="img" aria-label="アーキテクチャグラフ"></div>
    </div>
    <h2>ページ別 · 機能と進捗</h2>
    <p class="page-picker-hint">ページを選ぶと、その画面の構成ミニグラフと機能ごとの実装進捗が開きます。</p>
    <div class="page-cards" id="archPages"></div>
    <details class="feat-fold" id="featFold">
      <summary>ドメイン機能カタログ（全体）</summary>
      <div class="arch-panel feat-list-compact" style="margin-top:8px"><div id="archFeatures"></div></div>
    </details>
    <ul class="gaps" id="archGaps"></ul>
  </section>

  <div id="dynamic-views"></div>

  <footer id="foot">GitHub Pages · セッション＋開発 · スナップショット同期 · v=pages1</footer>
</div>
<script>
const REGISTRY_URL = 'views.json';
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let REG = null;
let activeId = null;
const timers = {};

function gaugeColor(h){ return h==='critical' ? 'var(--crit)' : h==='warn' ? 'var(--warn)' : 'var(--ok)'; }
function chips(r){
  const items = [];
  if (r.lane) items.push(['レーン', r.lane]);
  if (r.branch) items.push(['branch', r.branch]);
  if (r.model) items.push(['model', r.model]);
  if (r.uptime_human) items.push(['稼働', r.uptime_human]);
  if (r.idle_minutes != null) items.push(['idle', r.idle_minutes + '分']);
  items.push(['tokens', (r.context_tokens||0).toLocaleString()]);
  if (r.jsonl_mb != null) items.push(['log', r.jsonl_mb + ' MB']);
  if (r.pid) items.push(['PID', r.pid]);
  if (r.cwd_short) items.push(['cwd', r.cwd_short]);
  if (r.kind) items.push(['kind', r.kind]);
  return items.map(([k,v]) => `<span class="mchip"><strong>${esc(k)}</strong> ${esc(v)}</span>`).join('');
}
function renderSession(state){
  document.getElementById('updated').textContent = state.updated || '';
  document.getElementById('live').textContent = 'LIVE';
  document.getElementById('live').className = 'live';
  document.getElementById('liveDot').className = 'dot ok';
  const sess = state.sessions || [];
  document.getElementById('counts').textContent = `busy ${state.busy??0} · idle ${state.idle??0} · waits ${(state.waits&&state.waits.open||[]).length}`;
  const alerts = state.alerts || [];
  document.getElementById('alerts').innerHTML = alerts.length
    ? `<div class="alerts"><strong>注意</strong> ${alerts.map(a=>`${esc(a.name)} ${a.context_pct}%`).join(' / ')}</div>` : '';
  document.getElementById('sessions').innerHTML = sess.map(r => {
    const pct = r.context_pct == null ? 0 : Math.min(r.context_pct, 100);
    const title = r.summary || (r.doing_now || '').slice(0,80) || '(要約なし)';
    const bullets = (r.bullets && r.bullets.length) ? r.bullets : [];
    const tools = (r.tools_recent && r.tools_recent.length) ? r.tools_recent.join(', ') : '';
    return `<article class="window ${esc(r.status)} ${esc(r.health)}">
      <div class="titlebar">
        <div class="traffic"><i></i><i></i><i></i></div>
        <div class="wname" title="${esc(r.name)}">${esc(r.name)}</div>
        <span class="badge ${esc(r.status)}">${esc(r.status)}</span>
      </div>
      <div class="body">
        <div class="gauge" style="--gpct:${pct};--gcolor:${gaugeColor(r.health)}">
          <div class="gtxt"><b>${r.context_pct ?? '?'}%</b><small>CTX</small></div>
        </div>
        <div class="side">
          <div class="cwd" title="${esc(r.cwd||'')}">${esc(r.cwd_short || r.cwd || '')}</div>
          <div class="summary-title">${esc(title)}</div>
          ${bullets.length ? `<ul class="bullets">${bullets.slice(0,3).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : ''}
          <div class="meta-row">${chips(r)}</div>
          ${tools ? `<div class="userq">tools: ${esc(tools)}</div>` : ''}
          ${r.last_user ? `<div class="userq">last user: ${esc(r.last_user)}</div>` : ''}
          ${r.hint ? `<div class="hint">${esc(r.hint)}</div>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');
  const open = (state.waits && state.waits.open) || [];
  document.getElementById('waits').innerHTML = open.length ? open.map(w => `
    <article class="wcard ${w.urgent?'urgent':''}">
      <div class="num">${esc(w.id)}</div>
      <div>
        <h3>${esc(w.title)}</h3>
        <p>${esc(w.why)}</p>
        <ol>${(w.options||[]).map(o=>`<li>${esc(o)}</li>`).join('')}</ol>
        <div class="how">${esc(w.how||'')}</div>
        <span class="reply">${esc(w.reply||'')}</span>
      </div>
    </article>`).join('') : '<p class="closed">開いている堀江待ちはありません。</p>';
  const closed = (state.waits && state.waits.closed_notes) || [];
  document.getElementById('closed').textContent = closed.length ? ('決定済み: ' + closed.join(' / ')) : '';
}
function stLabel(s){
  return ({done:'実装済み', wip:'実装中', partial:'一部', todo:'未着手'})[s] || s;
}
const STATUS_COLOR = {
  done: '#0f7b6c', wip: '#d9730d', partial: '#cb912f', todo: '#b0aea7',
  layer: '#9b9a97', backbone: '#337ea9', source: '#5e6ad2'
};
let cy = null;
let lastGraphSig = '';
let archState = null;
let selectedPageId = null;
const pageCyMap = {};
function statusColor(st){ return STATUS_COLOR[st] || STATUS_COLOR.todo; }

function buildGraphElements(a){
  if (a.graph && a.graph.nodes) {
    return [...(a.graph.nodes||[]), ...(a.graph.edges||[])];
  }
  const els = [];
  (a.layers||[]).forEach(l => {
    els.push({ data: { id: 'layer-'+l.id, label: l.label||l.id, kind: 'layer', status: 'layer' } });
  });
  (a.pages||[]).forEach(p => {
    els.push({ data: { id: 'page-'+p.id, label: p.title||p.id, kind: 'page', status: p.status||'todo', pct: p.pct||0, path: p.path||'' } });
    if (p.layer) els.push({ data: { id: 'e-l-'+p.id, source: 'layer-'+p.layer, target: 'page-'+p.id, kind: 'contains' } });
    (p.features||[]).forEach(f => {
      els.push({ data: { id: 'e-pf-'+p.id+'-'+f.id, source: 'page-'+p.id, target: 'featnode-'+f.id, kind: 'uses' } });
    });
  });
  (a.features||[]).forEach(f => {
    els.push({ data: { id: 'featnode-'+f.id, label: f.title||f.id, kind: 'feature', status: f.status||'todo', pct: f.pct||0 } });
    if (f.layer) els.push({ data: { id: 'e-lf-'+f.id, source: 'layer-'+f.layer, target: 'featnode-'+f.id, kind: 'contains' } });
  });
  return els;
}

function paintStatusBorders(instance){
  instance.nodes('[kind="page"], [kind="feature"]').forEach(n => {
    const st = n.data('status');
    if (STATUS_COLOR[st]) n.style('border-color', STATUS_COLOR[st]);
  });
}

function renderCyGraph(a){
  const host = document.getElementById('archGraph');
  if (!host || !window.cytoscape) return;
  const els = buildGraphElements(a);
  const sig = JSON.stringify(els).length + ':' + (a.updated_iso || a.updated || '');
  if (cy && sig === lastGraphSig) {
    cy.resize();
    return;
  }
  lastGraphSig = sig;
  if (cy) { try { cy.destroy(); } catch(e) {} cy = null; }
  const hasDagre = !!(window.cytoscapeDagreRegistered);
  cy = window.cytoscape({
    container: host,
    elements: els,
    minZoom: 0.25,
    maxZoom: 2.5,
    wheelSensitivity: 0.25,
    style: cyNodeStyles(),
    layout: hasDagre
      ? { name: 'dagre', rankDir: 'TB', nodeSep: 28, rankSep: 48, edgeSep: 12, padding: 24, animate: false }
      : { name: 'breadthfirst', directed: true, padding: 24, spacingFactor: 1.15, animate: false }
  });
  paintStatusBorders(cy);
  cy.on('tap', 'node[kind="page"]', (evt) => {
    const id = String(evt.target.id() || '').replace(/^page-/, '');
    if (id) selectPage(id, true);
  });
  setTimeout(() => { if (cy) { cy.resize(); cy.fit(undefined, 32); } }, 40);
}

function wireGraphToolbar(){
  const wrap = document.getElementById('graphWrap');
  if (!wrap || wrap.dataset.wired) return;
  wrap.dataset.wired = '1';
  document.getElementById('graphFit').addEventListener('click', () => { if (cy) cy.fit(undefined, 32); });
  document.getElementById('graphZoomIn').addEventListener('click', () => { if (cy) cy.zoom({ level: cy.zoom() * 1.2, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } }); });
  document.getElementById('graphZoomOut').addEventListener('click', () => { if (cy) cy.zoom({ level: cy.zoom() / 1.2, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } }); });
  document.getElementById('graphFs').addEventListener('click', () => {
    wrap.classList.toggle('fullscreen');
    const btn = document.getElementById('graphFs');
    btn.textContent = wrap.classList.contains('fullscreen') ? 'Exit' : 'Fullscreen';
    setTimeout(() => { if (cy) { cy.resize(); cy.fit(undefined, 32); } }, 80);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && wrap.classList.contains('fullscreen')) {
      wrap.classList.remove('fullscreen');
      document.getElementById('graphFs').textContent = 'Fullscreen';
      setTimeout(() => { if (cy) { cy.resize(); cy.fit(undefined, 32); } }, 80);
    }
  });
}

function destroyPageCy(pid){
  if (pageCyMap[pid]) {
    try { pageCyMap[pid].destroy(); } catch(e) {}
    delete pageCyMap[pid];
  }
}

function buildPageGraphElements(p){
  const els = [];
  const pid = 'p-' + p.id;
  els.push({ data: { id: pid, label: p.title || p.id, kind: 'page', status: p.status || 'todo', pct: p.pct || 0 } });
  if (p.layer) {
    els.push({ data: { id: 'l-' + p.id, label: String(p.layer).toUpperCase(), kind: 'layer', status: 'layer' } });
    els.push({ data: { id: 'el-' + p.id, source: 'l-' + p.id, target: pid, kind: 'contains' } });
  }
  (p.features || []).forEach(f => {
    const fid = 'f-' + p.id + '-' + f.id;
    els.push({ data: { id: fid, label: f.title || f.id, kind: 'feature', status: f.status || 'todo', pct: f.pct || 0 } });
    els.push({ data: { id: 'ef-' + p.id + '-' + f.id, source: pid, target: fid, kind: 'uses' } });
  });
  const evs = (p.evidence || []).filter(x => String(x).startsWith('src/')).slice(0, 5);
  evs.forEach((ev, i) => {
    const short = String(ev).split('/').pop();
    const eid = 'ev-' + p.id + '-' + i;
    els.push({ data: { id: eid, label: short, kind: 'evidence', status: 'source' } });
    els.push({ data: { id: 'ee-' + p.id + '-' + i, source: pid, target: eid, kind: 'evidence' } });
  });
  return els;
}

function renderPageCy(p){
  const host = document.getElementById('pageCy-' + p.id);
  if (!host || !window.cytoscape) return;
  destroyPageCy(p.id);
  const els = buildPageGraphElements(p);
  const hasDagre = !!(window.cytoscapeDagreRegistered);
  const instance = window.cytoscape({
    container: host,
    elements: els,
    minZoom: 0.35,
    maxZoom: 2.2,
    wheelSensitivity: 0.22,
    style: cyNodeStyles(),
    layout: hasDagre
      ? { name: 'dagre', rankDir: 'LR', nodeSep: 22, rankSep: 56, edgeSep: 10, padding: 18, animate: false }
      : {
          name: 'concentric',
          concentric: n => n.data('kind') === 'page' ? 3 : (n.data('kind') === 'feature' ? 2 : 1),
          levelWidth: () => 1,
          minNodeSpacing: 36,
          padding: 18,
          animate: false
        }
  });
  paintStatusBorders(instance);
  pageCyMap[p.id] = instance;
  setTimeout(() => { instance.resize(); instance.fit(undefined, 28); }, 30);
}

function featTableRows(p){
  const feats = p.features || [];
  if (!feats.length) {
    return `<div class="page-empty-feats">このページに紐づく機能がまだありません（カタログ未設定または薄い紐付け）。</div>`;
  }
  const rows = feats.map(f => {
    const st = f.status || 'todo';
    const pct = Math.max(0, Math.min(100, f.pct ?? 0));
    const notes = f.notes ? `<div class="fnotes">${esc(f.notes)}</div>` : '';
    return `<tr>
      <td><div class="ftitle">${esc(f.title || f.id)}</div>${notes}<div class="path" style="margin-top:2px">${esc(f.id)}</div></td>
      <td><span class="stchip ${esc(st)}">${esc(stLabel(st))}</span></td>
      <td class="fpct">${pct}%
        <div class="pbar ${esc(st)}"><i style="width:${pct}%"></i></div>
      </td>
    </tr>`;
  }).join('');
  return `<table class="feat-table">
    <thead><tr><th>機能</th><th>状態</th><th>進捗</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function evidenceList(p){
  const ev = p.evidence || [];
  if (!ev.length) return `<p class="closed">根拠ファイルなし</p>`;
  const show = ev.slice(0, 12);
  const more = ev.length > 12 ? `<li>…他 ${ev.length - 12} 件</li>` : '';
  return `<ul class="ev-list">${show.map(x => `<li>${esc(x)}</li>`).join('')}${more}</ul>`;
}

function pageCard(p){
  const st = p.status || 'partial';
  const pct = Math.max(0, Math.min(100, p.pct ?? 0));
  const feats = p.features || [];
  const nFeats = feats.length;
  const open = selectedPageId === p.id;
  const preview = nFeats
    ? `<div class="feat-chips">${feats.slice(0, 6).map(f => {
        const fs = f.status || 'todo';
        return `<span class="fchip ${esc(fs)}" title="${esc(f.id)} ${f.pct??''}%"><i class="dot"></i>${esc(f.title||f.id)} <b style="font-weight:700;opacity:.75">${f.pct??0}%</b></span>`;
      }).join('')}${nFeats > 6 ? `<span class="fchip todo">+${nFeats - 6}</span>` : ''}</div>`
    : `<div class="notes">紐づく機能なし</div>`;
  return `<article class="page-card ${open ? 'is-open' : ''}" data-pid="${esc(p.id)}" id="pageCard-${esc(p.id)}">
    <button type="button" class="page-card-toggle" aria-expanded="${open?'true':'false'}" data-pid="${esc(p.id)}">
      <div class="page-card-head">
        <div>
          <div class="title">${esc(p.title||p.id)} <span class="chev" aria-hidden="true">▼</span></div>
          ${p.path ? `<div class="path">${esc(p.path)}</div>` : ''}
        </div>
        <span class="stchip ${esc(st)}">${esc(stLabel(st))} ${pct}%</span>
      </div>
      ${p.notes ? `<div class="notes">${esc(p.notes)}</div>` : ''}
      <div class="pbar ${esc(st)}"><i style="width:${pct}%"></i></div>
      ${preview}
    </button>
    <div class="page-detail" ${open ? '' : 'hidden'}>
      <div class="page-detail-meta">
        <span>画面進捗 <strong>${pct}%</strong></span>
        <span>機能 <strong>${nFeats}</strong> 件</span>
        ${p.path ? `<span class="path">${esc(p.path)}</span>` : ''}
      </div>
      <h4>このページの構成（インタラクティブ）</h4>
      <div class="page-graph-wrap" id="pageGraphWrap-${esc(p.id)}">
        <div class="graph-toolbar">
          <button type="button" data-pg-fit="${esc(p.id)}" title="全体表示">Fit</button>
          <button type="button" data-pg-zi="${esc(p.id)}" title="拡大">＋</button>
          <button type="button" data-pg-zo="${esc(p.id)}" title="縮小">−</button>
        </div>
        <div class="page-cy" id="pageCy-${esc(p.id)}" role="img" aria-label="${esc(p.title||p.id)} の構成図"></div>
      </div>
      <h4>機能一覧と実装進捗</h4>
      ${featTableRows(p)}
      <h4>根拠ファイル</h4>
      ${evidenceList(p)}
    </div>
  </article>`;
}

function selectPage(pid, scroll){
  if (!archState) return;
  const next = selectedPageId === pid ? null : pid;
  // destroy old
  if (selectedPageId && selectedPageId !== next) destroyPageCy(selectedPageId);
  selectedPageId = next;
  const host = document.getElementById('archPages');
  if (!host) return;
  host.querySelectorAll('.page-card').forEach(card => {
    const id = card.dataset.pid;
    const open = id === selectedPageId;
    card.classList.toggle('is-open', open);
    const btn = card.querySelector('.page-card-toggle');
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    const detail = card.querySelector('.page-detail');
    if (detail) {
      if (open) detail.removeAttribute('hidden');
      else detail.setAttribute('hidden', '');
    }
  });
  if (selectedPageId) {
    const p = (archState.pages || []).find(x => x.id === selectedPageId);
    if (p) {
      renderPageCy(p);
      if (scroll) {
        const el = document.getElementById('pageCard-' + selectedPageId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  }
}

function wirePageCards(){
  const host = document.getElementById('archPages');
  if (!host || host.dataset.wired === '1') return;
  host.dataset.wired = '1';
  host.addEventListener('click', (e) => {
    const t = e.target;
    if (!(t instanceof Element)) return;
    const fit = t.closest('[data-pg-fit]');
    if (fit) {
      e.preventDefault();
      const id = fit.getAttribute('data-pg-fit');
      const inst = pageCyMap[id];
      if (inst) inst.fit(undefined, 28);
      return;
    }
    const zi = t.closest('[data-pg-zi]');
    if (zi) {
      e.preventDefault();
      const id = zi.getAttribute('data-pg-zi');
      const inst = pageCyMap[id];
      if (inst) inst.zoom({ level: inst.zoom() * 1.2, renderedPosition: { x: inst.width()/2, y: inst.height()/2 } });
      return;
    }
    const zo = t.closest('[data-pg-zo]');
    if (zo) {
      e.preventDefault();
      const id = zo.getAttribute('data-pg-zo');
      const inst = pageCyMap[id];
      if (inst) inst.zoom({ level: inst.zoom() / 1.2, renderedPosition: { x: inst.width()/2, y: inst.height()/2 } });
      return;
    }
    const btn = t.closest('.page-card-toggle');
    if (btn) {
      e.preventDefault();
      selectPage(btn.getAttribute('data-pid'), false);
    }
  });
}

function renderArch(a){
  if (!a) return;
  archState = a;
  document.getElementById('live').textContent = 'LIVE';
  document.getElementById('live').className = 'live';
  document.getElementById('liveDot').className = 'dot ok';
  document.getElementById('updated').textContent = a.updated || '';
  const c = a.counts || {};
  const by = c.by_status || {};
  const links = c.page_feature_links != null ? c.page_feature_links
    : (a.pages||[]).reduce((n,p)=>n+((p.features||[]).length),0);
  document.getElementById('counts').textContent =
    `画面 ${c.pages??0} · 機能 ${c.features??0} · 紐付 ${links} · done ${by.done||0} / partial ${by.partial||0} / todo ${by.todo||0}`;
  document.getElementById('archMeta').textContent =
    `${a.repo || ''} @ ${a.branch || '?'} · ${a.repo_path || ''}`;
  document.getElementById('archLayers').innerHTML = (a.layers||[]).map(l =>
    `<div class="layer"><b>${esc(l.label||l.id)}</b><span>${esc(l.summary||'')}</span></div>`
  ).join('');
  // preserve open page across poll refresh
  const keep = selectedPageId;
  Object.keys(pageCyMap).forEach(destroyPageCy);
  document.getElementById('archPages').innerHTML =
    (a.pages||[]).map(pageCard).join('') || '<p class="closed">なし</p>';
  wirePageCards();
  const row = (it) => {
    const st = it.status || 'partial';
    const pct = Math.max(0, Math.min(100, it.pct ?? 0));
    return `<div class="arch-row">
      <div>
        <div class="title">${esc(it.title||it.id)}</div>
        ${it.domain ? `<div class="path">${esc(it.domain)}</div>` : ''}
        ${it.notes ? `<div class="notes">${esc(it.notes)}</div>` : ''}
        <div class="pbar ${esc(st)}"><i style="width:${pct}%"></i></div>
      </div>
      <span class="stchip ${esc(st)}">${esc(stLabel(st))} ${pct}%</span>
    </div>`;
  };
  document.getElementById('archFeatures').innerHTML =
    (a.features||[]).map(row).join('') || '<p class="closed">なし</p>';
  const gaps = a.gaps || [];
  document.getElementById('archGaps').innerHTML = gaps.length
    ? gaps.map(g => `<li>ギャップ: ${esc(g)}</li>`).join('') : '';
  wireGraphToolbar();
  renderCyGraph(a);
  if (keep && (a.pages||[]).some(p => p.id === keep)) {
    selectedPageId = null; // force re-open render
    selectPage(keep, false);
  }
}

async function tickSession(){
  try {
    const res = await fetch('monitor-state.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    renderSession(await res.json());
  } catch (e) {
    document.getElementById('live').textContent = 'OFFLINE';
    document.getElementById('live').className = 'err';
    document.getElementById('liveDot').className = 'dot crit';
  }
}
async function tickArch(){
  try {
    const res = await fetch('architecture-state.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    renderArch(await res.json());
  } catch (e) {
    const meta = document.getElementById('archMeta');
    if (meta) meta.textContent = 'architecture-state.json 未取得（build_architecture.py を実行）';
    if (activeId === 'dev-smarthr') {
      document.getElementById('live').textContent = 'OFFLINE';
      document.getElementById('live').className = 'err';
      document.getElementById('liveDot').className = 'dot crit';
    }
  }
}

function ensureDynamicView(v){
  if (v.type !== 'iframe' && v.type !== 'page') return;
  const host = document.getElementById('dynamic-views');
  let el = document.getElementById('view-' + v.id);
  if (el) return el;
  el = document.createElement('section');
  el.className = 'view';
  el.id = 'view-' + v.id;
  el.dataset.view = v.id;
  const src = v.href || v.htmlPartial || '';
  el.innerHTML = `<iframe class="iframe-view" title="${esc(v.label)}" src="${esc(src)}"></iframe>`;
  host.appendChild(el);
  return el;
}

function showView(id){
  if (!REG) return;
  const v = (REG.views || []).find(x => x.id === id) || (REG.views || [])[0];
  if (!v) return;
  activeId = v.id;
  ensureDynamicView(v);
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.id === v.id));
  document.querySelectorAll('.view').forEach(p => {
    const match = p.id === (v.panelId || ('view-' + v.id)) || p.dataset.view === v.id;
    p.classList.toggle('active', !!match);
  });
  const url = new URL(location.href);
  url.searchParams.set('v', 'tabs3');
  url.searchParams.set('view', v.id);
  history.replaceState(null, '', url.pathname + '?' + url.searchParams.toString() + '#' + v.id);
  document.getElementById('brandSub').textContent = v.label;
  // kick refresh for visible view
  if (v.id === 'session') tickSession();
  if (v.id === 'dev-smarthr') tickArch();
}

function renderTabs(reg){
  const nav = document.getElementById('tabs');
  nav.innerHTML = (reg.views || []).map(v =>
    `<button type="button" class="tab" data-id="${esc(v.id)}">${esc(v.label)}</button>`
  ).join('');
  nav.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => showView(btn.dataset.id));
  });
}

function currentViewId(reg){
  const q = new URLSearchParams(location.search).get('view');
  const h = (location.hash || '').replace(/^#/, '');
  const cand = q || h || reg.defaultView || (reg.views[0] && reg.views[0].id);
  if ((reg.views || []).some(v => v.id === cand)) return cand;
  return reg.defaultView || reg.views[0].id;
}

async function boot(){
  try {
    const res = await fetch(REGISTRY_URL + '?t=' + Date.now(), { cache: 'no-store' });
    REG = await res.json();
  } catch (e) {
    REG = {
      defaultView: 'session',
      views: [
        { id: 'session', label: 'セッション', type: 'panel', panelId: 'view-session' },
        { id: 'dev-smarthr', label: '開発 (smarthr-case-crm)', type: 'panel', panelId: 'view-dev' }
      ]
    };
  }
  renderTabs(REG);
  showView(currentViewId(REG));
  // always poll both JSON quietly so switches are fresh
  tickSession();
  tickArch();
  setInterval(tickSession, 5000);
  setInterval(tickArch, 5000);
  window.addEventListener('hashchange', () => showView(currentViewId(REG)));
}
boot();

<script>
(function(){
  const emb = {
    'monitor-state.json': 'MONITOR_STATE',
    'architecture-state.json': 'ARCHITECTURE_STATE',
    'views.json': 'VIEWS_REGISTRY'
  };
  const _fetch = window.fetch.bind(window);
  window.fetch = async function(input, init){
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    const base = url.split('?')[0].split('/').pop();
    const id = emb[base];
    if (id) {
      const el = document.getElementById(id);
      if (el) {
        return new Response(el.textContent, {status:200, headers:{'Content-Type':'application/json'}});
      }
    }
    return _fetch(input, init);
  };
})();
</script>
